name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # ci-weekly.yaml calls this file on a schedule. The schedule is NOT here
  # on purpose: GitHub disables a workflow with a `schedule:` after 60 quiet
  # days, and it disables the push / pull_request runs along with it (#28).
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ycpss91255-lab/test-tools:latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -S warning bootstrap.sh

      - name: Bats integration tests
        run: >-
          bats test/integration/bootstrap_spec.bats
          test/integration/workflow_triggers_spec.bats

  # Separate job, not another step above, for two reasons. The hermetic
  # suite must stay runnable with no network, and a GitHub outage must not
  # be reportable as a bootstrap defect -- one red job says which of the two
  # happened, one red step does not.
  live-base:
    name: bootstrap against the live base
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ycpss91255-lab/test-tools:latest
    steps:
      - uses: actions/checkout@v4

      - name: Bats live-base guard
        env:
          BOOTSTRAP_LIVE_BASE: "1"
        run: bats test/integration/bootstrap_live_spec.bats
